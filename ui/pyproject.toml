[project]
name = "ui"
version = "1.0.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "comic-localizer",
    "gradio>=6.0,<7",
    "poethepoet>=0.39.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "torch",
    "torchvision",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
comic-localizer = { path = "../localizer", editable = true }

[tool.poe.tasks.start]
help = "run the Gradio UI"
cmd  = "python gradio_app.py"

